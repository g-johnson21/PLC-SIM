  # ---- Digital outputs / valves (NI-9476), mapping per D3 -----------------
  - tag: S1
    pid_tag: S1
    daq_column: "DC1 LOx Tank BB (state)"
    aliases: [SV-LOXBB, DC1]
    kind: digital_out
    signal: solenoid
    units: bool
    range: null
    module: NI-9476
    module_index: 0
    channel: 0
    normal_state: "NC"
    energize_polarity: open_when_energized
    description: LOX bang-bang pressurization solenoid
    verified: false
    notes: >-
      D12 (2026-09-13): this loop ran on the previous system's own bang-bang
      controller board, not the GC — daq_column (DC1) is only the GC's
      manual command and does not track the true valve state (96.0% percent
      agreement with the board's own telemetry in the 124919 hotfire, worse
      elsewhere). D13 (2026-09-13): both the board and DC1 wire to the same
      solenoid, either can open it (in the 125242 safing run the GC alone
      opened S1, 302.82-330.53s, board silent) — RunData.valves["S1"] is the
      OR of the board's BBD telemetry (RunData.bbd["ox"].press_cmd) and the
      raw DC1 command; DC1 is kept separately as RunData.gc_commands["S1"].
    dc_index: 1
    solenoid_command_index: 1

