[project]
name = "draco-sim"
version = "0.1.0"
description = "Draco test stand PLC training simulator backend"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.3",
    "pyyaml>=6",
    "websockets>=13",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["draco_sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
